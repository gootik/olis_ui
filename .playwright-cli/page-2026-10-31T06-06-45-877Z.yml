        - paragraph [ref=f18e1116]: "The Slider component implements the ARIA slider pattern and provides:"
        - list [ref=f18e1117]:
          - listitem [ref=f18e1118]: Full keyboard navigation support (Arrow keys, Home, End, Page Up/Down)
          - listitem [ref=f18e1119]: Screen reader announcements for value changes
          - listitem [ref=f18e1120]: Proper focus management
          - listitem [ref=f18e1121]: Support for disabled states
          - listitem [ref=f18e1122]: HTML form integration via hidden input elements
          - listitem [ref=f18e1123]: Internationalization support with locale-aware value formatting
          - listitem [ref=f18e1124]: Right-to-left (RTL) language support
          - listitem [ref=f18e1125]: Step dots are decorative, hidden from assistive technology, and add no tab stops
          - listitem [ref=f18e1126]: Mark labels remain readable text and do not replace the slider's accessible label or value announcements
        - paragraph [ref=f18e1127]:
          - text: For more information, see the
          - link "React Aria Slider documentation" [ref=f18e1128] [cursor=pointer]:
            - /url: https://react-spectrum.adobe.com/react-aria/Slider.html
          - text: .
