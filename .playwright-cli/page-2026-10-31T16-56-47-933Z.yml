            - strong [ref=f8e1463]: Label
            - text: "- Field label component from"
            - code [ref=f8e1464]: "@heroui/react"
          - listitem [ref=f8e1465]:
            - strong [ref=f8e1466]: DateField.Group
            - text: "- Date input group component (documented below)"
          - listitem [ref=f8e1467]:
            - strong [ref=f8e1468]: DateField.Input
            - text: "- Input component with segmented editing from"
            - code [ref=f8e1469]: "@heroui/react"
          - listitem [ref=f8e1470]:
            - strong [ref=f8e1471]: DateField.InputContainer
            - text: "- Scrollable container for grouping multiple inputs (e.g. start/end range inputs) with horizontal overflow"
          - listitem [ref=f8e1472]:
            - strong [ref=f8e1473]: DateField.Segment
            - text: "- Individual date segment (year, month, day, etc.)"
          - listitem [ref=f8e1474]:
            - strong [ref=f8e1475]: DateField.Prefix
            - text: /
            - strong [ref=f8e1476]: DateField.Suffix
            - text: "- Prefix and suffix slots for the input group"
          - listitem [ref=f8e1477]:
            - strong [ref=f8e1478]: Description
            - text: "- Helper text component from"
            - code [ref=f8e1479]: "@heroui/react"
          - listitem [ref=f8e1480]:
            - strong [ref=f8e1481]: FieldError
            - text: "- Validation error message from"
            - code [ref=f8e1482]: "@heroui/react"
        - paragraph [ref=f8e1483]: "Each of these components has its own props API. Use them directly within DateField for composition:"
        - figure [ref=f8e1484]:
          - button "Copy Text" [ref=f8e1486] [cursor=pointer]
          - region [ref=f8e1487]:
            - code [ref=f8e1489]:
              - generic [ref=f8e1490]: "import {parseDate} from '@internationalized/date';"
              - generic [ref=f8e1491]: "import {DateField, Label, Description, FieldError} from '@heroui/react';"
              - generic [ref=f8e1493]: <DateField
              - generic [ref=f8e1494]: isRequired
              - generic [ref=f8e1495]: "isInvalid={hasError}"
              - generic [ref=f8e1496]: "minValue={today(getLocalTimeZone())}"
              - generic [ref=f8e1497]: "value={date}"
              - generic [ref=f8e1498]: "onChange={setDate}"
              - generic [ref=f8e1499]: ">"
              - generic [ref=f8e1500]: <Label>Appointment Date</Label>
              - generic [ref=f8e1501]: <DateField.Group>
              - generic [ref=f8e1502]: <DateField.Input>
              - generic [ref=f8e1503]: "{(segment) => <DateField.Segment segment={segment} />}"
              - generic [ref=f8e1504]: </DateField.Input>
              - generic [ref=f8e1505]: </DateField.Group>
              - generic [ref=f8e1506]: <Description>Select a date from today onwards.</Description>
              - generic [ref=f8e1507]: <FieldError>Please select a valid date.</FieldError>
              - generic [ref=f8e1508]: </DateField>
        - heading [level=3] [ref=f8e1509]:
          - link "DateValue Types" [ref=f8e1510] [cursor=pointer]:
            - /url: "#datevalue-types"
          - button "Copy Anchor Link" [ref=f8e1511]
