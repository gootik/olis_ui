              - generic [ref=f8e1538]: const date = parseDate('2024-01-15');
              - generic [ref=f8e1540]: // Today's date
              - generic [ref=f8e1541]: const todayDate = today(getLocalTimeZone());
              - generic [ref=f8e1543]: // Use in DateField
              - generic [ref=f8e1544]: "<DateField value={date} onChange={setDate}>"
