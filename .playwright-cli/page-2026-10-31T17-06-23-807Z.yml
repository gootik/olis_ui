        - paragraph [ref=f14e1187]:
          - text: Each toast implements the
          - link "WAI-ARIA alertdialog pattern" [ref=f14e1188] [cursor=pointer]:
            - /url: https://www.w3.org/WAI/ARIA/apg/patterns/alertdialog/
          - text: ", grouped inside a labeled landmark region:"
        - list [ref=f14e1189]:
          - listitem [ref=f14e1190]:
            - strong [ref=f14e1191]: Landmark region
            - text: ": Toasts render in a labeled landmark reachable with"
            - code [ref=f14e1192]: F6
            - text: ;
            - code [ref=f14e1193]: Alt
            - text: +
            - code [ref=f14e1194]: T
            - text: moves focus straight to it. The hotkey is configurable via the
            - code [ref=f14e1195]: hotkey
            - text: prop and can be disabled by passing an empty array, and the region label can be overridden with
            - code [ref=f14e1196]: aria-label
          - listitem [ref=f14e1197]:
            - strong [ref=f14e1198]: Keyboard
            - text: ":"
            - code [ref=f14e1199]: Tab
            - text: reaches the controls of visible toasts,
            - code [ref=f14e1200]: Escape
            - text: collapses the expanded stack, and dismissing a focused toast moves focus to the nearest remaining toast
          - listitem [ref=f14e1201]:
            - strong [ref=f14e1202]: Screen readers
            - text: ": Each toast uses"
            - code [ref=f14e1203]: role="alertdialog"
            - text: with its title and description linked; new toasts are announced automatically
          - listitem [ref=f14e1204]:
            - strong [ref=f14e1205]: Timers
            - text: ": Auto-dismiss pauses while the stack is hovered or focused, and while the page is in a background tab"
