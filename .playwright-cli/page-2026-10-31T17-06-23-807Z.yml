          - region [ref=f14e1008]:
            - code [ref=f14e1010]:
              - generic [ref=f14e1011]: "import { toast } from '@heroui/react';"
              - generic [ref=f14e1013]: // Basic toast (auto-dismisses after 4 seconds by default)
              - generic [ref=f14e1014]: toast("Event has been created");
              - generic [ref=f14e1016]: // Variant methods (also auto-dismiss after 4 seconds by default)
              - generic [ref=f14e1017]: toast.success("File saved");
              - generic [ref=f14e1018]: toast.info("New update available");
              - generic [ref=f14e1019]: toast.warning("Please check your settings");
              - generic [ref=f14e1020]: toast.danger("Something went wrong");
              - generic [ref=f14e1022]: // With options. The returned id lets the action close its own toast.
              - generic [ref=f14e1023]: "const eventId = toast(\"Event has been created\", {"
