            - strong [ref=f30e812]: Label
            - text: "- Field label component from"
            - code [ref=f30e813]: "@heroui/react"
          - listitem [ref=f30e814]:
            - strong [ref=f30e815]: TimeField.Group
            - text: "- Time input group component (documented below)"
          - listitem [ref=f30e816]:
            - strong [ref=f30e817]: TimeField.Input
            - text: "- Input component with segmented editing from"
            - code [ref=f30e818]: "@heroui/react"
          - listitem [ref=f30e819]:
            - strong [ref=f30e820]: TimeField.Segment
            - text: "- Individual time segment (hour, minute, second, etc.)"
          - listitem [ref=f30e821]:
            - strong [ref=f30e822]: TimeField.Prefix
            - text: /
            - strong [ref=f30e823]: TimeField.Suffix
            - text: "- Prefix and suffix slots for the input group"
          - listitem [ref=f30e824]:
            - strong [ref=f30e825]: Description
            - text: "- Helper text component from"
            - code [ref=f30e826]: "@heroui/react"
          - listitem [ref=f30e827]:
            - strong [ref=f30e828]: FieldError
            - text: "- Validation error message from"
            - code [ref=f30e829]: "@heroui/react"
        - paragraph [ref=f30e830]: "Each of these components has its own props API. Use them directly within TimeField for composition:"
        - figure [ref=f30e831]:
          - button "Copy Text" [ref=f30e833] [cursor=pointer]
          - region [ref=f30e834]:
            - code [ref=f30e836]:
              - generic [ref=f30e837]: "import {parseTime} from '@internationalized/date';"
              - generic [ref=f30e838]: "import {TimeField, Label, Description, FieldError} from '@heroui/react';"
              - generic [ref=f30e840]: <TimeField
              - generic [ref=f30e841]: isRequired
              - generic [ref=f30e842]: "isInvalid={hasError}"
              - generic [ref=f30e843]: "minValue={parseTime('09:00')}"
              - generic [ref=f30e844]: "maxValue={parseTime('17:00')}"
              - generic [ref=f30e845]: "value={time}"
              - generic [ref=f30e846]: "onChange={setTime}"
              - generic [ref=f30e847]: ">"
              - generic [ref=f30e848]: <Label>Appointment Time</Label>
              - generic [ref=f30e849]: <TimeField.Group>
              - generic [ref=f30e850]: <TimeField.Input>
              - generic [ref=f30e851]: "{(segment) => <TimeField.Segment segment={segment} />}"
              - generic [ref=f30e852]: </TimeField.Input>
              - generic [ref=f30e853]: </TimeField.Group>
              - generic [ref=f30e854]: <Description>Select a time between 9:00 AM and 5:00 PM.</Description>
              - generic [ref=f30e855]: <FieldError>Please select a valid time.</FieldError>
              - generic [ref=f30e856]: </TimeField>
        - heading [level=3] [ref=f30e857]:
          - link "TimeValue Types" [ref=f30e858] [cursor=pointer]:
            - /url: "#timevalue-types"
          - button "Copy Anchor Link" [ref=f30e859]
        - paragraph [ref=f30e864]:
          - text: TimeField uses types from
          - link [ref=f30e865] [cursor=pointer]:
            - /url: https://react-aria.adobe.com/internationalized/date/
            - code [ref=f30e866]: "@internationalized/date"
          - text: ":"
        - list [ref=f30e867]:
          - listitem [ref=f30e868]:
            - code [ref=f30e869]: Time
            - text: "- Time only (hour, minute, second)"
          - listitem [ref=f30e870]:
            - code [ref=f30e871]: CalendarDateTime
            - text: "- Date with time but no timezone (TimeField displays only the time portion)"
          - listitem [ref=f30e872]:
            - code [ref=f30e873]: ZonedDateTime
            - text: "- Date with time and timezone (TimeField displays only the time portion)"
        - paragraph [ref=f30e874]: "Example:"
        - figure [ref=f30e875]:
          - button "Copy Text" [ref=f30e877] [cursor=pointer]
          - region [ref=f30e878]:
            - code [ref=f30e880]:
              - generic [ref=f30e881]: "import {parseTime, Time, getLocalTimeZone, now} from '@internationalized/date';"
              - generic [ref=f30e883]: // Parse from string
              - generic [ref=f30e884]: const time = parseTime('14:30');
              - generic [ref=f30e886]: // Create from current time
              - generic [ref=f30e887]: const currentTime = now(getLocalTimeZone());
              - generic [ref=f30e888]: const timeValue = new Time(currentTime.hour, currentTime.minute, currentTime.second);
              - generic [ref=f30e890]: // Use in TimeField
              - generic [ref=f30e891]: "<TimeField value={time} onChange={setTime}>"
              - generic [ref=f30e892]: "{/* ... */}"
              - generic [ref=f30e893]: </TimeField>
        - blockquote [ref=f30e894]:
          - paragraph [ref=f30e895]:
            - strong [ref=f30e896]: "Note:"
